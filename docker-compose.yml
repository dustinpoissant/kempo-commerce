# Database for kempo-commerce's integration tier. The other kempo repos have claimed 5433-5440,
# 5442-5447 and 5449-5452 (and 5455), so this one takes 5453 — they can all be up at once.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kempo-commerce-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kempo
      POSTGRES_PASSWORD: kempo
      POSTGRES_DB: kempo_commerce_test
    ports:
      - "5453:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kempo"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_test_data:
