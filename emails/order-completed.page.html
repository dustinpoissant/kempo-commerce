<!--
	owner: kempo-commerce
	variables:
		name: The customer's name. Empty when there is none.
		orderNumber: The order's number.
		orderLink: The link to the order.
		siteName: The name of the store.
		lines: Each item, with name, quantity and total.
		subtotal: The items' total before fees and tax.
		feeTotal: The total of fees.
		taxTotal: The total of tax.
		total: The order's total.
		hasFees: True when the order has fees.
		hasTax: True when the order has tax.
-->
<page template="email" title="Your order is complete">
<content>
<h2>Your order is complete</h2>
<if condition="name"><p>Hi {{name}},</p></if>
<if condition="!name"><p>Hello,</p></if>
<p>Your order {{orderNumber}} is complete. Thank you for shopping with {{siteName}}.</p>
<table class="mb">
<tr><th>Item</th><th class="ta-right">Total</th></tr>
<foreach in="lines" as="line">
<tr><td>{{line.name}} &times; {{line.quantity}}</td><td class="ta-right">{{line.total}}</td></tr>
</foreach>
<tr><td class="ta-right">Subtotal</td><td class="ta-right">{{subtotal}}</td></tr>
<if condition="hasFees"><tr><td class="ta-right">Fees</td><td class="ta-right">{{feeTotal}}</td></tr></if>
<if condition="hasTax"><tr><td class="ta-right">Tax</td><td class="ta-right">{{taxTotal}}</td></tr></if>
<tr><td class="ta-right"><strong>Total</strong></td><td class="ta-right"><strong>{{total}}</strong></td></tr>
</table>
<p class="ta-center"><a class="btn primary" href="{{orderLink}}">View your order</a></p>
</content>
</page>
