<page template="email" title="Part of your order was refunded">
<content>
<h2>Part of your order was refunded</h2>
<if condition="name"><p>Hi {{name}},</p></if>
<if condition="!name"><p>Hello,</p></if>
<p>We refunded {{refundAmount}} of order {{orderNumber}}.</p>
<if condition="refundReason"><p>{{refundReason}}</p></if>
<p class="ta-center"><a class="btn primary" href="{{orderLink}}">View your order</a></p>
</content>
</page>
