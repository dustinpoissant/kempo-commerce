<!--
	owner: kempo-commerce
	variables:
		siteName: The name of the store.
		orderNumber: The order's number.
		placedDate: When the order was placed.
		shipTo: The lines of the shipping address.
		hasShipTo: True when there is a shipping address.
		packItems: Each item to pack, with name, options, quantity.
		itemCount: How many items there are in all.
-->
<page template="email" title="Packing slip">
<content>
<h2>Packing slip</h2>
<p>
	<strong>{{siteName}}</strong><br>
	Order {{orderNumber}}<if condition="placedDate"> &middot; placed {{placedDate}}</if>
</p>
<if condition="hasShipTo">
<h3>Ship to</h3>
<p>
<foreach in="shipTo" as="part">{{part}}<br>
</foreach>
</p>
</if>
<h3>Items ({{itemCount}})</h3>
<table class="mb">
<tr><th>Qty</th><th>Item</th></tr>
<foreach in="packItems" as="item">
<tr><td>{{item.quantity}}</td><td>{{item.name}}<if condition="item.hasOptions"><br><span class="tc-muted">{{item.options}}</span></if></td></tr>
</foreach>
</table>
<p>Thank you for your order.</p>
</content>
</page>
